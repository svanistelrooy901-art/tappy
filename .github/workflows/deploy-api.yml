# Deploys the leaderboard API (Cloudflare Worker + D1) after the server tests pass.
# Needs these GitHub repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SEED_SECRET, ADMIN_KEY
name: Deploy API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'src/core/**', 'src/config.js', '.github/workflows/deploy-api.yml']
concurrency: deploy-api
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Server tests (replay + API against a local SQLite)
        run: node --no-warnings server/test/api.test.mjs && node --no-warnings test/replay.test.mjs
      - name: Install wrangler
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Apply database migrations
        working-directory: server
        run: npx wrangler d1 migrations apply tappy-db --remote
      - name: Deploy worker
        working-directory: server
        run: npx wrangler deploy
      - name: Set worker secrets
        working-directory: server
        env:
          SEED_SECRET: ${{ secrets.SEED_SECRET }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          printf '%s' "$SEED_SECRET" | npx wrangler secret put SEED_SECRET
          printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
