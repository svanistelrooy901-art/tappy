name = "tappy-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# D1 database "tappy-db" (APAC / Singapore), created 2026-10-04
[[d1_databases]]
binding = "DB"
database_name = "tappy-db"
database_id = "65c800fd-e7e7-4c25-9941-72a5e20205d3"
migrations_dir = "migrations"

# Replaying a long run costs CPU time. The free plan's 10 ms limit is too small for that; the paid plan allows more.
[limits]
cpu_ms = 5000
