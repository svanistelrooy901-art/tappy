name = "tappy-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Fill in database_id after `wrangler d1 create tappy` (see server/README.md)
[[d1_databases]]
binding = "DB"
database_name = "tappy"
database_id = "REPLACE_WITH_REAL_ID"
migrations_dir = "migrations"

# Replaying a long run costs CPU time. The free plan's 10 ms limit is too small for that; the paid plan allows more.
[limits]
cpu_ms = 5000
